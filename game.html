<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fish Catcher — built from one prompt</title>
<style>
  html, body { margin: 0; padding: 0; background: #8ec9ff; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="game" width="720" height="1280" style="width:100vw;height:100vh"></canvas>
<script>
'use strict';
// Fish Catcher: a cat catches falling fish.
// Prompt: "Build me a tiny browser game: a cat catches falling fish with
// the arrow keys. Score for every catch, game over after 3 misses."
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
// Logic runs in 1080x1920 space; the backing store is 720x1280 (cheaper to
// rasterise in software) and the browser upscales it to the window.
ctx.setTransform(720 / 1080, 0, 0, 1280 / 1920, 0, 0);
const W = 1080, H = 1920;
const GROUND_Y = 1700;
const CAT_Y = 1640;

const state = {
  score: 0,
  misses: 0,
  over: false,
  catX: W / 2,
  catDir: 0,          // -1 left, 0 idle, 1 right
  catTarget: null,    // touch target x
  fish: [],
  popups: [],
  particles: [],
  spawnTimer: 0,
  spawnEvery: 0.75,
  time: 0,
  flash: 0,
};

let fishSeq = 0;

const FISH_KINDS = [
  { color: '#4aa8ff', value: 1, speed: 1.0 },
  { color: '#ff7eb6', value: 1, speed: 1.15 },
  { color: '#7be495', value: 2, speed: 1.3 },
  { color: '#ffd23f', value: 3, speed: 1.5 },
];

function spawnFish() {
  const kind = FISH_KINDS[Math.floor(Math.random() * FISH_KINDS.length)];
  state.fish.push({
    id: ++fishSeq,
    x: 70 + Math.random() * (W - 140),
    y: -60,
    vy: (260 + Math.random() * 160 + state.score * 6) * kind.speed,
    wobble: Math.random() * Math.PI * 2,
    kind,
  });
}

function reset() {
  state.score = 0;
  state.misses = 0;
  state.over = false;
  state.fish = [];
  state.popups = [];
  state.particles = [];
  state.spawnTimer = 0;
  state.spawnEvery = 0.75;
  state.flash = 0;
}

function burst(x, y, color) {
  for (let i = 0; i < 14; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 120 + Math.random() * 260;
    state.particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80, life: 0.6, color });
  }
}

function update(dt) {
  state.time += dt;
  if (state.flash > 0) state.flash -= dt;

  // Cat movement: keyboard dir wins, else touch target.
  const speed = 950;
  if (state.catDir !== 0) {
    state.catX += state.catDir * speed * dt;
    state.catTarget = null;
  } else if (state.catTarget !== null) {
    const dx = state.catTarget - state.catX;
    const step = Math.sign(dx) * Math.min(Math.abs(dx), speed * dt);
    state.catX += step;
    if (Math.abs(dx) < 4) state.catTarget = null;
  }
  state.catX = Math.max(110, Math.min(W - 110, state.catX));

  if (!state.over) {
    state.spawnTimer += dt;
    if (state.spawnTimer >= state.spawnEvery) {
      state.spawnTimer = 0;
      spawnFish();
      state.spawnEvery = Math.max(0.42, 0.75 - state.score * 0.012);
    }
  }

  for (let i = state.fish.length - 1; i >= 0; i--) {
    const f = state.fish[i];
    f.y += f.vy * dt;
    f.x += Math.sin(state.time * 3 + f.wobble) * 40 * dt;
    // Caught? Cat's basket zone is around CAT_Y, width ~230.
    if (!state.over && f.y > CAT_Y - 40 && f.y < CAT_Y + 110 && Math.abs(f.x - state.catX) < 150) {
      state.score += f.kind.value;
      state.popups.push({ x: f.x, y: f.y - 30, text: '+' + f.kind.value, life: 0.9, color: '#ffffff' });
      burst(f.x, f.y, f.kind.color);
      state.fish.splice(i, 1);
      continue;
    }
    // Missed: fish hits the ground.
    if (f.y > H - 40) {
      state.fish.splice(i, 1);
      if (!state.over) {
        state.misses += 1;
        state.flash = 0.35;
        state.popups.push({ x: f.x, y: H - 220, text: 'MISS', life: 0.9, color: '#ff5a5a' });
        if (state.misses >= 3) state.over = true;
      }
    }
  }

  for (let i = state.popups.length - 1; i >= 0; i--) {
    const p = state.popups[i];
    p.y -= 60 * dt;
    p.life -= dt;
    if (p.life <= 0) state.popups.splice(i, 1);
  }
  for (let i = state.particles.length - 1; i >= 0; i--) {
    const p = state.particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 500 * dt;
    p.life -= dt;
    if (p.life <= 0) state.particles.splice(i, 1);
  }
}

function drawCloud(x, y, s) {
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.beginPath();
  ctx.ellipse(x, y, 90 * s, 42 * s, 0, 0, Math.PI * 2);
  ctx.ellipse(x + 70 * s, y + 10 * s, 70 * s, 34 * s, 0, 0, Math.PI * 2);
  ctx.ellipse(x - 70 * s, y + 12 * s, 62 * s, 30 * s, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawFishShape(x, y, size, color, flip) {
  ctx.save();
  ctx.translate(x, y);
  if (flip) ctx.scale(-1, 1);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(0, 0, size, size * 0.55, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-size * 0.85, 0);
  ctx.lineTo(-size * 1.5, -size * 0.55);
  ctx.lineTo(-size * 1.5, size * 0.55);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(size * 0.45, -size * 0.12, size * 0.14, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#191419';
  ctx.beginPath();
  ctx.arc(size * 0.48, -size * 0.12, size * 0.07, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawCat() {
  const x = state.catX;
  const y = CAT_Y;
  const moving = state.catDir !== 0 || state.catTarget !== null;
  const bob = moving ? Math.sin(state.time * 14) * 6 : Math.sin(state.time * 2) * 3;
  const wag = Math.sin(state.time * 6) * 0.35;
  ctx.save();
  ctx.translate(x, y + bob);

  // Tail
  ctx.strokeStyle = '#f5a623';
  ctx.lineWidth = 26;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-95, 30);
  ctx.quadraticCurveTo(-170, 10 + wag * 40, -150, -70 + wag * 30);
  ctx.stroke();
  ctx.strokeStyle = '#fff3d6';
  ctx.lineWidth = 26;
  ctx.beginPath();
  ctx.moveTo(-150, -70 + wag * 30);
  ctx.quadraticCurveTo(-146, -84 + wag * 30, -138, -88 + wag * 30);
  ctx.stroke();

  // Body
  ctx.fillStyle = '#f5a623';
  ctx.beginPath();
  ctx.ellipse(0, 0, 105, 78, 0, 0, Math.PI * 2);
  ctx.fill();
  // Belly
  ctx.fillStyle = '#ffe1a8';
  ctx.beginPath();
  ctx.ellipse(10, 22, 68, 48, 0, 0, Math.PI * 2);
  ctx.fill();
  // Stripes
  ctx.strokeStyle = '#d98a12';
  ctx.lineWidth = 10;
  ctx.beginPath();
  ctx.moveTo(-40, -72); ctx.lineTo(-28, -40);
  ctx.moveTo(0, -78); ctx.lineTo(0, -44);
  ctx.moveTo(40, -72); ctx.lineTo(30, -40);
  ctx.stroke();

  // Head
  ctx.fillStyle = '#f5a623';
  ctx.beginPath();
  ctx.arc(0, -108, 72, 0, Math.PI * 2);
  ctx.fill();
  // Ears
  ctx.beginPath();
  ctx.moveTo(-52, -148); ctx.lineTo(-64, -205); ctx.lineTo(-12, -168);
  ctx.closePath();
  ctx.moveTo(52, -148); ctx.lineTo(64, -205); ctx.lineTo(12, -168);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#ffb3c1';
  ctx.beginPath();
  ctx.moveTo(-46, -154); ctx.lineTo(-54, -186); ctx.lineTo(-24, -164);
  ctx.closePath();
  ctx.moveTo(46, -154); ctx.lineTo(54, -186); ctx.lineTo(24, -164);
  ctx.closePath();
  ctx.fill();
  // Eyes
  ctx.fillStyle = '#191419';
  ctx.beginPath();
  ctx.arc(-26, -116, 9, 0, Math.PI * 2);
  ctx.arc(26, -116, 9, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(-23, -119, 3, 0, Math.PI * 2);
  ctx.arc(29, -119, 3, 0, Math.PI * 2);
  ctx.fill();
  // Nose + mouth
  ctx.fillStyle = '#ff7eb6';
  ctx.beginPath();
  ctx.moveTo(-12, -92); ctx.lineTo(12, -92); ctx.lineTo(0, -78);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#191419';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(0, -78); ctx.quadraticCurveTo(0, -66, -14, -62);
  ctx.moveTo(0, -78); ctx.quadraticCurveTo(0, -66, 14, -62);
  ctx.stroke();
  // Whiskers
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(25,20,25,0.65)';
  ctx.beginPath();
  ctx.moveTo(-58, -92); ctx.lineTo(-108, -100);
  ctx.moveTo(-58, -82); ctx.lineTo(-106, -78);
  ctx.moveTo(58, -92); ctx.lineTo(108, -100);
  ctx.moveTo(58, -82); ctx.lineTo(106, -78);
  ctx.stroke();

  // Paws
  ctx.fillStyle = '#f5a623';
  ctx.beginPath();
  ctx.ellipse(-58, 66, 30, 18, 0, 0, Math.PI * 2);
  ctx.ellipse(58, 66, 30, 18, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawHeart(x, y, s, filled) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.fillStyle = filled ? '#ff5a7a' : 'rgba(255,255,255,0.45)';
  ctx.beginPath();
  ctx.moveTo(0, 14);
  ctx.bezierCurveTo(-22, -6, -12, -22, 0, -10);
  ctx.bezierCurveTo(12, -22, 22, -6, 0, 14);
  ctx.fill();
  ctx.restore();
}

// Static background, prerendered once: full-screen gradients every frame in
// software rendering are slow, and the capture needs a smooth frame rate.
const bgCanvas = document.createElement('canvas');
bgCanvas.width = 720;
bgCanvas.height = 1280;
(function paintBackground() {
  const b = bgCanvas.getContext('2d');
  b.setTransform(720 / 1080, 0, 0, 1280 / 1920, 0, 0);
  const sky = b.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#7ec3ff');
  sky.addColorStop(0.55, '#bfe6ff');
  sky.addColorStop(1, '#fff3c9');
  b.fillStyle = sky;
  b.fillRect(0, 0, W, H);
  b.fillStyle = '#ffd23f';
  b.beginPath(); b.arc(880, 210, 95, 0, Math.PI * 2); b.fill();
  b.fillStyle = '#ffe98a';
  b.beginPath(); b.arc(880, 210, 72, 0, Math.PI * 2); b.fill();
  b.fillStyle = '#8ed081';
  b.beginPath();
  b.moveTo(0, GROUND_Y - 60);
  b.quadraticCurveTo(W * 0.3, GROUND_Y - 190, W * 0.62, GROUND_Y - 70);
  b.quadraticCurveTo(W * 0.85, GROUND_Y - 10, W, GROUND_Y - 90);
  b.lineTo(W, H);
  b.lineTo(0, H);
  b.closePath();
  b.fill();
  b.fillStyle = '#6cbf5e';
  b.fillRect(0, GROUND_Y + 40, W, H - GROUND_Y - 40);
})();

function draw() {
  // Sky, sun, hills, ground: one blit, sized in logical units so the
  // 2/3 backing-store transform maps it to the full canvas.
  ctx.drawImage(bgCanvas, 0, 0, W, H);

  // Clouds drift with time
  const cx1 = ((state.time * 22) % (W + 500)) - 250;
  drawCloud(cx1, 300, 1.1);
  drawCloud(W - cx1, 520, 0.85);
  drawCloud((cx1 + 500) % (W + 500) - 250, 120, 0.7);

  // Falling fish
  for (const f of state.fish) drawFishShape(f.x, f.y, 42, f.kind.color, false);

  // Cat
  drawCat();

  // Particles + popups
  for (const p of state.particles) {
    ctx.globalAlpha = Math.max(0, p.life / 0.6);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 10, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  for (const p of state.popups) {
    ctx.globalAlpha = Math.max(0, p.life / 0.9);
    ctx.font = '900 64px "DejaVu Sans", sans-serif';
    ctx.lineWidth = 10;
    ctx.strokeStyle = 'rgba(25,20,25,0.55)';
    ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;

  // HUD: title + score + hearts
  ctx.textAlign = 'left';
  ctx.font = '900 54px "DejaVu Sans", sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.lineWidth = 10;
  ctx.strokeStyle = 'rgba(25,20,25,0.35)';
  ctx.strokeText('FISH CATCHER', 48, 96);
  ctx.fillText('FISH CATCHER', 48, 96);
  ctx.textAlign = 'center';
  ctx.font = '900 120px "DejaVu Sans", sans-serif';
  ctx.strokeText(String(state.score), W / 2, 250);
  ctx.fillStyle = '#ffffff';
  ctx.fillText(String(state.score), W / 2, 250);
  ctx.font = '700 34px "DejaVu Sans", sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.fillText('SCORE', W / 2, 300);
  for (let i = 0; i < 3; i++) drawHeart(880 + i * 62, 78, 1.5, i < 3 - state.misses);

  // Miss flash
  if (state.flash > 0) {
    ctx.fillStyle = 'rgba(255,60,60,' + (state.flash * 0.9).toFixed(2) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  // Game over overlay
  if (state.over) {
    ctx.fillStyle = 'rgba(25,20,25,0.55)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.font = '900 110px "DejaVu Sans", sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('GAME OVER', W / 2, 820);
    ctx.font = '700 64px "DejaVu Sans", sans-serif';
    ctx.fillText('Score: ' + state.score, W / 2, 940);
    ctx.font = '700 44px "DejaVu Sans", sans-serif';
    ctx.fillStyle = '#ffe98a';
    ctx.fillText('Press R to play again', W / 2, 1040);
  }
}

let last = performance.now();
let halted = false;
function loop(now) {
  if (halted) return;
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// Deterministic stepping for footage capture: halt the wall-clock loop and
// advance the same update+draw by fixed 1/30s steps. Same code, same
// physics, same real key events — just stepped instead of wall-clock.
window.__halt = function () { halted = true; };
window.__step = function (dt) { update(dt); draw(); };

window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') state.catDir = -1;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') state.catDir = 1;
  if (e.key === 'r' || e.key === 'R') reset();
});
window.addEventListener('keyup', (e) => {
  if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && state.catDir === -1) state.catDir = 0;
  if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && state.catDir === 1) state.catDir = 0;
});
canvas.addEventListener('touchstart', (e) => { state.catTarget = e.touches[0].clientX * (W / canvas.clientWidth); });
canvas.addEventListener('touchmove', (e) => { state.catTarget = e.touches[0].clientX * (W / canvas.clientWidth); });

// State hook for the capture driver: the real game loop keeps running;
// the driver only sends it real key events.
window.__fish = state;
</script>
</body>
</html>
